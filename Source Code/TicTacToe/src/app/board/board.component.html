@if (!value) {
<button class="square" [class.winning-style]="isWinning" [class.snapshot-style]="isSnapshot">{{value}}</button>
}
@if (value == 'A') {
<button class="square a-mark" [class.winning-style]="isWinning" [class.snapshot-style]="isSnapshot">{{value}}</button>
}
@if (value == 'B') {
<button class="square b-mark" [class.winning-style]="isWinning" [class.snapshot-style]="isSnapshot">{{value}}</button>
}
